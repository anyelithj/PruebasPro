[tool.poetry]
name = "fastapi-backend"
version = "0.1.0"
description = "Enterprise FastAPI backend — portfolio web"
authors = ["Anghelo <jacjineth@gmail.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0.36" }
asyncpg = "^0.30.0"
alembic = "^1.14.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
pyjwt = "^2.10.0"
argon2-cffi = "^23.1.0"
redis = "^5.2.0"
python-multipart = "^0.0.12"
email-validator = "^2.2.0"
structlog = "^24.4.0"
websockets = "^13.1"

# gRPC (NestJS <-> FastAPI)
grpcio = "^1.68.0"
grpcio-tools = "^1.68.0"
protobuf = "^5.28.0"

# Cola asíncrona
celery = { extras = ["redis"], version = "^5.4.0" }

# Machine Learning (módulo ml: fraude en wallets + clasificación de contacto)
scikit-learn = "^1.4"                   # IsolationForest + TF-IDF/LogisticRegression
numpy = "^2.0"                          # vectores de características

# IA open source (sin API keys de terceros)
langgraph = "^0.2.0"                    # Orquestación ReAct del agente blockchain
langchain-ollama = "^0.3.0"            # LLM Qwen2.5 / chat vía Ollama
langchain-core = "^0.3.0"
llama-index = "^0.12.0"                # RAG sobre el portafolio
llama-index-vector-stores-postgres = "^0.3.0"
llama-index-embeddings-ollama = "^0.5.0"

# Blockchain — Solana (Opción A)
solana = "^0.35.0"                     # Cliente RPC Solana
solders = "^0.21.0"                    # Keypairs y tipos Solana

# Blockchain — Ethereum (Opción B)
web3 = "^7.0.0"                        # Cliente Ethereum
eth-account = "^0.12.0"               # Firma de transacciones

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"
aiosqlite = "^0.20.0"
ruff = "^0.7.0"
black = "^24.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
