# dev: solo Postgres + Redis; API corre local con reload
name: fastapi-portafolio

services:
  postgres:
    image: postgres:16-alpine
    container_name: fastapi-portafolio-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio
    ports:
      - "5434:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fastapi-portafolio-redis-dev
    ports:
      # 6381 en el host: 6379 lo ocupa el redis de otro proyecto (proydemo).
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata_dev:
