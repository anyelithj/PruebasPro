syntax = "proto3";

// [ISP][SRP] contrato usuarios — consulta mínima entre backends.
package user;

service UserService {
  rpc GetUser(GetUserRequest) returns (UserReply);
}

message GetUserRequest {
  string user_id = 1;
}

message UserReply {
  string id = 1;
  string name = 2;
  string email = 3;
  string role = 4;
  bool is_active = 5;
}
