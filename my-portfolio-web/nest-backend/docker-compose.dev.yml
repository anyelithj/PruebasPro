# dev: solo Postgres + Redis; API corre local con watch
name: nest-portafolio

services:
  postgres:
    image: postgres:16-alpine
    container_name: nest-portafolio-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio_nest
    ports:
      - "5433:5432"
    volumes:
      - pgdata_nest_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nest-portafolio-redis-dev
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata_nest_dev:
