# Stack Docker — languageProject
# Servicios: backend (NestJS), minio + minio-init (crea el bucket), redis, postgres, mailhog, pgadmin
# Variables: archivo .env de la raíz (DATABASE_NAME, DATABASE_USER, DATABASE_PASSWORD, MINIO_ROOT_USER, MINIO_ROOT_PASSWORD, S3_BUCKET)
# Levantar:  docker compose -f docker-compose.dev.yml up -d --build
# Detener:   docker compose -f docker-compose.dev.yml stop
# Logs:      docker compose -f docker-compose.dev.yml logs -f backend
# Guía paso a paso: apps/frontend-next/pendiente.md

# Docker Compose exige nombre de proyecto en minúsculas
name: languageproject

services:
  # ───────────── NestJS API ─────────────
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    image: languageproject-backend
    container_name: languageProject_backend
    # Perfil opcional: Nest corre local con `pnpm run start` (puerto 4000). Para dockerizarlo: --profile docker-backend
    profiles: ["docker-backend"]
    restart: unless-stopped
    ports:
      - "4000:4000"
    # Secretos y configuración del backend (JWT, OAuth, CORS…) desde su propio .env
    env_file:
      - ./apps/backend/.env
    # Sobrescribe solo lo que cambia dentro de Docker (nombres de servicio en vez de localhost)
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-languageproject}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      # [Sprint 6.7]: almacenamiento S3 en MinIO (en producción las mismas variables apuntan a Cloudflare R2)
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000          # El backend habla con MinIO por la red de Docker
      S3_PUBLIC_ENDPOINT: http://localhost:9900 # Host de las URL firmadas que abre el navegador
      S3_REGION: us-east-1                    # MinIO firma con us-east-1 (R2 usa "auto")
      S3_BUCKET: ${S3_BUCKET:-aula-idiomas}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_FORCE_PATH_STYLE: "true"
      # Ollama y ai-service corren en Windows (fuera de Docker)
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      AI_SERVICE_URL: http://host.docker.internal:8000
      # [Sprint 7.10]: manual de usuario y FAQ inicial (montados de solo lectura desde el repo)
      HELP_MANUAL_DIR: /app/docs/manual-usuario
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # [Materiales de cursos]: videos/PDF subidos persisten fuera del contenedor
    volumes:
      - backend-uploads:/app/uploads
      - ./docs/manual-usuario:/app/docs/manual-usuario:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    networks:
      - languageproject-net

  # ───────────── MinIO (almacenamiento S3 compatible) ─────────────
  minio:
    image: minio/minio:latest
    container_name: languageProject_minio
    restart: unless-stopped
    ports:
      - "9900:9000"   # API S3
      - "9901:9001"   # Consola web
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - languageproject-net

  # [Sprint 6.7 · minio-init]: crea el bucket de desarrollo (privado, sin acceso anónimo) y termina | `--ignore-existing`: idempotente en cada `up`
  minio-init:
    image: minio/mc:latest
    container_name: languageProject_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-aula-idiomas}
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc anonymous set none local/$$S3_BUCKET"
    restart: "no"
    networks:
      - languageproject-net

  # ───────────── Redis ─────────────
  redis:
    image: redis:7-alpine
    container_name: languageProject_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - languageproject-net

  # ───────────── PostgreSQL ─────────────
  postgres:
    image: postgres:16-alpine
    container_name: languageProject_postgres
    restart: unless-stopped
    ports:
      # 5433: acceso desde Windows sin chocar con el PostgreSQL nativo (que ocupa 127.0.0.1:5432)
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-languageproject}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-languageproject}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - languageproject-net

  # ───────────── MailHog (correo falso de desarrollo) ─────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: languageProject_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - languageproject-net

  # ───────────── pgAdmin ─────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: languageProject_pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      # pgAdmin rechaza dominios ".local"; por eso ".dev"
      PGADMIN_DEFAULT_EMAIL: admin@languageproject.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - languageproject-net

networks:
  languageproject-net:
    driver: bridge

# Volúmenes nuevos (languageproject_*): los de proydemo no se tocan
volumes:
  backend-uploads:
  postgres-data:
  redis-data:
  pgadmin-data:
  minio-data:
