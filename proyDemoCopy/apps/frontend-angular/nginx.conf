# [Nginx · remoto Angular]: sirve el build en :9100 bajo /ng/ con cabeceras de seguridad y caché de assets | [Patrón]: Static File Server + SPA Fallback | [Rendimiento]: gzip + caché larga de chunks (outputHashing en los lazy chunks) | [Seguridad]: nosniff, frame-ancestors, referrer-policy
# Next.js reescribe /tutor, /redaccion… → http://angular:9100/ng/ y /ng/* → http://angular:9100/ng/* (mismo origen para el navegador)

server {
  listen 9100;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "frame-ancestors 'self'" always;

  # [Assets]: chunk-*.js y fuentes cambian de nombre en cada build → caché de 1 año
  location ~* ^/ng/.+\.(js|css|woff2|png|webp|svg|ico)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # [main.js / styles.css]: nombres fijos (los carga Next.js para los Angular Elements) → siempre revalidar
  location ~ ^/ng/(main\.js|styles\.css)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  # [SPA fallback]: cualquier ruta /ng/* sin archivo → index.html (el router de Angular decide)
  location /ng/ {
    try_files $uri /ng/index.html;
    add_header Cache-Control "no-cache";
  }
}
