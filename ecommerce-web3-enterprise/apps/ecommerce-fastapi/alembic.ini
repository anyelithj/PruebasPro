# alembic.ini (Alembic / SQLAlchemy) => configuración de migraciones versionadas de ecommerce-fastapi
# La URL de base de datos NO se escribe aquí: migrations/env.py la lee de DATABASE_URL (12-Factor: config en el entorno)

# [alembic] => sección principal que lee el comando "alembic"
# (INI de configparser: los comentarios van en su propia línea; al final de un valor se volverían parte del valor)
[alembic]
# Carpeta de migraciones (nombre definido en 02_FASTAPI.md); %(here)s = carpeta de este .ini
script_location = %(here)s/migrations
# Agrega la raíz del proyecto al sys.path => env.py puede importar "app.*"
prepend_sys_path = .
# Separador de rutas según el sistema operativo (Windows/Linux)
path_separator = os

# --- Logging de Alembic (formato estándar de logging.config de Python) ---
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
