<html lang="es"><head><meta charset="UTF-8">

<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,Helvetica,sans-serif;font-size:15px}
a{color:var(--pr);text-decoration:none}button,input,select,textarea{font:inherit}
.nav{display:flex;gap:16px;align-items:center;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.nav .logo{font-weight:700;font-size:18px;color:var(--pr)}.nav .sp{flex:1}
.btn{background:var(--pr);color:#fff;border:0;padding:9px 16px;border-radius:8px;cursor:pointer;display:inline-block}
.btn:hover{background:var(--pr2)}.btn.o{background:transparent;color:var(--pr);border:1px solid var(--pr)}.btn.d{background:var(--er)}.btn.s{padding:5px 10px;font-size:13px}
.hero{padding:70px 24px;text-align:center;background:linear-gradient(135deg,#5b4bdb,#a855f7);color:#fff}
.hero h1{font-size:38px;margin:0 0 12px}.hero p{max-width:620px;margin:0 auto 22px}
.wrap{max-width:1100px;margin:0 auto;padding:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.card h3{margin:0 0 6px}.mu{color:var(--mu);font-size:13px}.pr{font-weight:700;color:var(--pr)}
.chip{display:inline-block;padding:4px 12px;border:1px solid var(--bd);border-radius:20px;margin:0 6px 6px 0;cursor:pointer;background:var(--card);color:var(--tx)}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.app{display:flex;min-height:calc(100vh - 54px)}
.side{width:230px;background:var(--card);border-right:1px solid var(--bd);padding:12px;flex-shrink:0}
.side a{display:block;padding:9px 12px;border-radius:8px;color:var(--tx);margin-bottom:2px}
.side a.on,.side a:hover{background:var(--pr);color:#fff}.main{flex:1;padding:24px;min-width:0}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px}
th,td{padding:10px;text-align:left;border-bottom:1px solid var(--bd);font-size:14px}th{color:var(--mu)}
.tw{overflow-x:auto}.bar{height:14px;background:var(--pr);border-radius:4px}
.tag{padding:2px 9px;border-radius:12px;font-size:12px;background:var(--bd)}
.tag.Activo,.tag.Entregado,.tag.Aprobada,.tag.Vigente{background:#dcfce7;color:#166534}
.tag.Cancelado,.tag.Rechazada,.tag.Inactivo{background:#fee2e2;color:#991b1b}
.tag.Pendiente,.tag.Borrador,.tag.Enviado{background:#fef3c7;color:#92400e}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(440px,92vw)}
label{display:block;margin:10px 0 4px;font-size:13px;color:var(--mu)}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.msg{padding:10px;border-radius:8px;margin:10px 0;background:#fee2e2;color:#991b1b}
.ok{background:#dcfce7;color:#166534}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px;flex-wrap:wrap}
.warn{background:#fef3c7;color:#92400e}.nft{font-size:40px}.tag.Atendida{background:#dcfce7;color:#166534}
.gh{font-size:11px;text-transform:uppercase;color:var(--mu);margin:14px 8px 4px}.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1b1f2a;color:#fff;padding:10px 16px;border-radius:8px;z-index:99}
.tag.Aprobado,.tag.Emitida,.tag.Sincronizado,.tag.Publicado,.tag.Activa,.tag.Recibida{background:#dcfce7;color:#166534}.tag.Anulada,.tag.Reembolsado,.tag.Inactiva{background:#fee2e2;color:#991b1b}
.tag.En_revisión,.tag.Programada,.tag.Enviada,.tag.Pausado{background:#fef3c7;color:#92400e}.tag.Confirmado,.tag.En_preparación,.tag.Empacado,.tag.En_tránsito,.tag.En_atención,.tag.Escalada{background:#e0e7ff;color:#3730a3}
.tabs{display:flex;gap:4px;align-items:center;border-bottom:1px solid var(--bd);margin-bottom:18px;overflow-x:auto;white-space:nowrap}.tabs b{margin-right:12px}.tabs a{padding:9px 14px;color:var(--tx);border-bottom:3px solid transparent}.tabs a.on{border-bottom-color:var(--pr);color:var(--pr);font-weight:700}.tabs a:hover{background:var(--bg)}
.side{transition:width .2s}.side a i{float:right;font-style:normal;opacity:.7}.side a.dd.on{background:var(--bd);color:var(--tx)}.sub{margin:0 0 6px 14px;border-left:2px solid var(--bd)}.sub a{padding:6px 10px;font-size:14px}
.sbh{display:flex;justify-content:space-between;align-items:center;padding:2px 8px 8px;font-size:13px}.side .sbh a{display:inline;padding:2px 4px;margin:0}
.side.mini{width:64px;padding:12px 6px}.side.mini a{text-align:center;padding:9px 0}.side.mini span,.side.mini .gh,.side.mini i,.side.mini .sub{display:none}.side.mini .sbh{justify-content:center}
@media(max-width:760px){.side .sub{display:flex;margin:0;border:0}.side .gh{display:none}.side.mini{width:100%}}
@media(max-width:760px){.side{display:block;overflow:visible;width:100%;border-right:0;border-bottom:1px solid var(--bd)}.side a{white-space:normal}.side .gh{display:block}}
.side.hide{display:none!important}
.side a.gs{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin-top:10px;padding:8px 12px}.side a.gs:hover{background:var(--bd);color:var(--tx)}.side a.gs.cl{color:var(--tx)}.side.mini a.gs{display:none}
.app{align-items:flex-start}.side{position:sticky;top:54px;align-self:flex-start;height:calc(100vh - 54px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin}
.side::-webkit-scrollbar{width:6px}.side::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
@media(max-width:760px){.side{position:static;height:auto;max-height:65vh;width:100%}}
@media print{#root{display:none}dialog{border:0;width:100%}}
@media(max-width:760px){.app{flex-direction:column}.side{width:100%;display:flex;overflow-x:auto;gap:4px}.side a{white-space:nowrap}.hero h1{font-size:28px}}
</style></head><body>

function app(r){const k=r[2]||'dashboard',id=r[3];let b;
if(k=='dashboard')b=dash();else if(!MOD[k]||!perm(k))b=`<div class="msg">403 · Tu rol (${user.role}) no tiene acceso a este módulo.</div>`;
else if(id&&DB[k])b=detalle(k,id);else b=({perfil,web3,auditoria:audit,chat:chatPage,fidelidad:fid,notificaciones:notifs,config:cfg,cobertura:cob}[k]||(()=>crud(k)))();
const h=hubOf(k),ts=h?tabsOf(h):[],tb=ts.length>1&&perm(k)?`<div class="tabs"><b>${h[1]} ${h[0]}</b>${ts.map(t=>`<a class="${t==k?'on':''}" href="#/app/${t}">${TL[t]||MOD[t].t}</a>`).join('')}</div>`:'';
return `<div class="app"><div class="side${SB.mini?' mini':''}${SB.hide?' hide':''}" id="sb">${side(k)}</div><div class="main"><button class="btn o s" style="margin-bottom:12px" onclick="hideSB()" title="Mostrar u ocultar el menú">☰ Menú</button>${tb}${b}</div></div>`}
/* ===== Sidebar con grupos desplegables (Operación, Clientes, etc.) ===== */
SB.sec={};
const isS=n=>SB.sec[n]===undefined?true:SB.sec[n];
function side(k0){const cur=hubOf(k0),cl=`onclick="if(innerWidth<760)SB.hide=true"`,lk=h=>`<a class="${cur==h?'on':''}" href="#/app/${tabsOf(h)[0]}" title="${h[0]}" ${cl}>${h[1]}<span> ${h[0]}</span></a>`;
return `<div class="sbh"><a href="#" onclick="mini();return false" title="${SB.mini?'Expandir menú':'Contraer menú'}">${SB.mini?'»':'«'}</a><span><a href="#" onclick="allS(true);return false">Abrir todo</a> · <a href="#" onclick="allS(false);return false">Cerrar todo</a></span></div><a class="${k0=='dashboard'?'on':''}" href="#/app/dashboard" title="Dashboard" ${cl}>📊<span> Dashboard</span></a>`+SEC.map(x=>{const hs=x[1].filter(h=>tabsOf(h).length);if(!hs.length)return '';const op=isS(x[0]);return `<a class="gs ${hs.includes(cur)&&!op?'cl':''}" href="#" onclick="tgS('${x[0]}');return false">${x[0]}<i>${op?'▾':'▸'}</i></a>`+((op||SB.mini)?hs.map(lk).join(''):'')}).join('')}
function tgS(n){SB.sec[n]=!isS(n);rsb()}
function allS(o){SEC.forEach(x=>SB.sec[x[0]]=o);rsb()}
addEventListener('hashchange',render);render();
</script></body></html>
