# nginx.conf => API Gateway + composición de microfrontends por rutas (Nginx open source, BSD-2).
# UNA sola puerta de entrada (http://localhost) para el navegador:
#   - Microservicios: /api/v1, /graphql, /socket.io, /webhook -> Express | /ai -> FastAPI | /rs -> Rust
#   - Microfrontends: /cms/* (páginas, API Nitro y assets /cms/_nuxt) -> Nuxt | todo lo demás -> Next.js
# Gateway DELGADO (patrón Gateway Routing + Offloading): enruta, comprime, limita tráfico y cachea estáticos.
# La autenticación (JWT) y las reglas de negocio siguen en cada servicio: el gateway no conoce el dominio.

# "auto" => un worker por núcleo de CPU (sin procesos ociosos)
worker_processes auto;

events {
  worker_connections 1024; # Conexiones simultáneas por worker (suficiente para desarrollo y un servidor pequeño)
}

http {
  # "resolver" => DNS interno de Docker; "valid=10s" re-resuelve nombres. Junto con proxy_pass por VARIABLE, Nginx arranca
  # aunque un servicio opcional (fastapi, rust, nuxt: perfiles de compose) no esté levantado: responde 502 solo en su ruta
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Rendimiento/energía: sendfile y tcp_nopush envían archivos sin copiarlos a memoria de usuario
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;
  server_tokens off; # No revelar la versión de Nginx (seguridad)
  client_max_body_size 10m; # Subida de imágenes (Cloudinary firma en el backend; el cuerpo no debería superar esto)

  # Compresión: menos bytes por la red => menos energía y carga más rápida en móviles (el CPU de gzip es mínimo)
  gzip on;
  gzip_comp_level 5; # Punto medio: 5 comprime casi como 9 con mucho menos CPU
  gzip_min_length 1024; # Archivos pequeños no se comprimen (el encabezado cuesta más de lo que ahorra)
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml application/graphql-response+json;

  # Caché de estáticos con hash (/_next/static, /_nuxt): Node no vuelve a servirlos => menos CPU y RAM en las apps
  # "max_size=200m" => tope en disco; "inactive=7d" => borra lo que no se pide en 7 días; "keys_zone=10m" (~80.000 claves)
  proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:10m max_size=200m inactive=7d use_temp_path=off;

  # Rate limit GRUESO por IP para todas las APIs (protege también a FastAPI y Rust). Express mantiene sus límites finos
  # por ruta (login, 2FA) en Redis: son capas distintas, no duplicadas. "burst" absorbe picos legítimos sin rechazarlos
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_status 429;

  # WebSocket: "Upgrade" solo si el cliente lo pide (Socket.io); en otro caso la conexión se cierra normalmente
  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  server {
    listen 80;
    # HTTPS opcional (producción): si existe /etc/nginx/tls/*.conf se suma "listen 443 ssl", los certificados y la
    # redirección http -> https (plantilla: infra/nginx/tls/tls.conf.example). En desarrollo no hay archivos: solo HTTP
    include /etc/nginx/tls/*.conf;

    # Encabezados comunes hacia los servicios: IP real y protocolo original (Express usa "trust proxy")
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket (Socket.io y HMR de next dev). Van aquí y no en cada location: si una location define un solo
    # proxy_set_header, Nginx deja de heredar TODOS los del server (perdería la IP real)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Destinos por VARIABLE (resolución perezosa, ver "resolver"). Nombres = servicios de docker-compose.dev.yml
    set $express http://ecommerce-express:4000;
    set $next http://ecommerce-next:3000;
    set $nuxt http://ecommerce-nuxt:3000;
    set $fastapi http://ecommerce-fastapi:8000;
    set $rust http://ecommerce-rust:8080;

    # --- Microservicios ---
    # Express: REST v1 y su documentación (/api/docs). El resto de /api/* es de Next (next-auth, revalidate, webhooks)
    location /api/v1/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass $express;
    }
    location /api/docs {
      proxy_pass $express;
    }
    location /graphql {
      limit_req zone=api burst=40 nodelay;
      proxy_pass $express;
    }
    # Webhook de Stripe: sin rate limit (los reintentos de Stripe no deben rechazarse) y cuerpo crudo intacto
    location /webhook/ {
      proxy_pass $express;
    }
    # Socket.io de Express usa path "/ws/socket.io" (socket.config.ts): feed social en vivo y chat de Communication
    location /ws/ {
      proxy_read_timeout 1h; # Conexión en tiempo real de larga duración
      proxy_pass $express;
    }
    # FastAPI (IA) y Rust (alto rendimiento): "rewrite ... break" quita el prefijo (/ai/health -> /health)
    location /ai/ {
      limit_req zone=api burst=20 nodelay;
      rewrite ^/ai/(.*)$ /$1 break;
      proxy_pass $fastapi;
    }
    location /rs/ {
      limit_req zone=api burst=40 nodelay;
      rewrite ^/rs/(.*)$ /$1 break;
      proxy_pass $rust;
    }

    # --- Microfrontends (composición por rutas) ---
    # Nuxt (contenido, landings, blog, PWA y panel de contenido) vive COMPLETO bajo /cms/ (app.baseURL de Nuxt):
    # páginas, su API Nitro (/cms/api/...) y sus assets (/cms/_nuxt/). Un solo prefijo => cero choques con Next.
    location /cms/_nuxt/ {
      proxy_cache static;
      proxy_cache_valid 200 7d;
      proxy_pass $nuxt;
    }
    location /cms/ {
      proxy_pass $nuxt;
    }
    # Estáticos de Next con hash en el nombre: inmutables => caché en el gateway
    location /_next/static/ {
      proxy_cache static;
      proxy_cache_valid 200 7d;
      proxy_pass $next;
    }
    # Todo lo demás (tienda, cuenta, checkout, dashboard, /api/auth...) => Next.js (shell principal)
    location / {
      proxy_pass $next;
    }

    # Salud del propio gateway (Docker healthcheck)
    location = /gateway/health {
      access_log off;
      return 200 "ok";
    }
  }
}
